<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230a0a0c%27/%3E%3Cpath fill=%27%23f1efe9%27 d=%27M2 1.5 6 5h4l4-3.5V9c0 3.5-2.7 5.5-6 5.5S2 12.5 2 9z%27/%3E%3Cpath fill=%27%230a0a0c%27 d=%27M5 8h2v2H5zM9 8h2v2H9z%27/%3E%3C/svg%3E" />
  <title>ChaX</title>
  <link rel="preload" href="/fonts/JetBrainsMono-400.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* ChaX speaks the AgGr language: a void, one amber signal, one monospace face, depth instead of boxes.
       Sizes are AgGr's four-step ramp, stretched one notch for reading chat on a phone. */
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/JetBrainsMono-400.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    :root {
      --void: #0a0a0c;
      --void-2: #111114;
      --dust-1: #38383e;
      --dust-2: #5c5c64;
      --dust-3: #8c8c93;
      --ivory: #f1efe9;
      --ivory-2: #c9c7c1;
      --danger: #ff6b5b;
      --amber: #ffb000;
      --mono: 'JetBrains Mono', 'Cascadia Code', ui-monospace, 'SFMono-Regular', Consolas, monospace;
      --fs-front: 20px;
      --fs-mid: 16px;
      --fs-rear: 13px;
      --fs-dust: 12px;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --top: max(env(safe-area-inset-top), 12px);
      --bottom: max(env(safe-area-inset-bottom), 12px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--void); color: var(--ivory); font: 400 var(--fs-mid)/1.45 var(--mono);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      background-image: radial-gradient(ellipse 70% 38% at 50% -6%, rgba(241, 239, 233, .07), transparent 70%);
      background-repeat: no-repeat; background-attachment: fixed;
    }
    ::selection { background: var(--amber); color: var(--void); }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    button, input, textarea { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; border-radius: 0; }
    button { cursor: pointer; text-align: left; touch-action: manipulation; }
    input, textarea { caret-color: var(--amber); outline: none; }
    input:focus-visible, textarea:focus-visible { outline: none; }
    ::placeholder { color: var(--dust-3); opacity: 1; }
    * { scrollbar-width: thin; scrollbar-color: var(--dust-1) transparent; }
    .hide { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .dim { color: var(--dust-3); }
    .fill { flex: 1; min-width: 12px; border-bottom: 1px dotted var(--dust-2); transform: translateY(-4px); }
    .amber { color: var(--amber); }
    .tnum { font-variant-numeric: tabular-nums; }

    /* ---- welcome ---- */
    #welcome { min-height: 100%; padding: calc(var(--top) + 8vh) 20px var(--bottom); display: flex; justify-content: center; }
    #welcome form { width: min(480px, 100%); display: flex; flex-direction: column; gap: 26px; }
    #welcome h1 { margin: 0; font-weight: 400; font-size: var(--fs-front); }
    #welcome h1 .car { color: var(--amber); }
    #welcome p { margin: 6px 0 0; color: var(--dust-3); font-size: var(--fs-mid); max-width: 38ch; text-wrap: pretty; }
    .qline { display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: var(--fs-front); }
    .qline .car { color: var(--amber); flex: none; }
    .qline input { flex: 1; min-width: 0; font-size: var(--fs-front); min-height: 48px; }
    .facts { display: grid; gap: 4px; font-size: var(--fs-rear); color: var(--dust-3); }
    .facts div { display: flex; gap: 10px; align-items: baseline; min-height: 28px; }
    .go { align-self: flex-start; min-height: 48px; font-size: var(--fs-front); color: var(--amber); padding: 0 2px; }
    .go:hover { color: var(--ivory); }

    /* ---- shell ---- */
    #app { height: 100dvh; display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); }
    #side { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--dust-1); padding-top: var(--top); }
    .top { padding: 4px 20px 0; }
    .id { display: flex; align-items: baseline; gap: 12px; min-height: 44px; }
    .id .cat { flex: none; align-self: flex-start; margin-top: 1px; color: var(--amber); }
    .id .wm { font-size: var(--fs-mid); letter-spacing: .02em; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fp { font-size: var(--fs-dust); color: var(--dust-3); min-height: 40px; width: 100%; display: flex; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; }
    .fp #meFp { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fp:hover { color: var(--ivory); }
    .fp .act { color: var(--dust-3); flex: none; margin-left: auto; }
    .fp:hover .act { color: var(--amber); }
    .id #flash { margin-left: auto; font-size: var(--fs-dust); color: var(--ivory); }
    .sondeLine { display: flex; align-items: baseline; gap: 12px; min-height: 28px; font-size: var(--fs-rear); color: var(--dust-3); }
    .sondeLine #meshTxt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .upd { min-height: 44px; width: 100%; text-align: left; font-size: var(--fs-rear); color: var(--amber); }
    .upd:hover { color: var(--ivory); }
    .links { display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; flex: none; min-height: 44px; justify-content: center; padding: 0 4px; margin-left: auto; margin-top: -10px; }
    .id #flash:not(:empty) + .links { margin-left: 12px; }
    .gear { flex: none; align-self: flex-start; display: grid; place-items: center; min-height: 44px; min-width: 44px; margin: -10px -10px 0 0; color: var(--dust-3); }
    .gear:hover { color: var(--amber); }
    .links svg { display: block; flex: none; }
    .links [data-s="live"] { color: var(--amber); }
    .links [data-s="idle"] { color: var(--ivory-2); }
    .links [data-s="off"] { color: var(--dust-3); }
    .links .x { display: none; }
    .links [data-s="off"] .x { display: inline; }
    .sonde { display: inline-flex; gap: 3px; letter-spacing: 0; color: var(--dust-3); flex: none; }
    .sonde i { font-style: normal; display: inline-block; }
    .sonde i.on { color: var(--ivory); }
    .sonde.ping i { animation: blip .7s var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
    @keyframes blip { 0% { transform: translateY(0); color: var(--ivory); } 35% { transform: translateY(-3px); color: var(--ivory); } 100% { transform: translateY(0); } }
    .groupbar { display: flex; justify-content: space-between; padding: 22px 20px 6px; font-size: var(--fs-dust); text-transform: uppercase; letter-spacing: .12em; color: var(--dust-3); }

    #convs { flex: 1; overflow-y: auto; padding: 0 8px calc(var(--bottom) + 8px); overscroll-behavior: contain; }
    .row { display: flex; flex-direction: column; justify-content: center; width: 100%; min-height: 52px; padding: 6px 12px; transition: transform .38s var(--ease), filter .38s var(--ease), opacity .38s var(--ease), background .15s; }
    .row .l1 { display: flex; align-items: baseline; gap: 10px; width: 100%; }
    .row .glyph { width: 1.2ch; flex: none; text-align: center; color: var(--dust-3); }
    .row .glyph.on { color: var(--ivory); }
    .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; }
    .row .meta { font-size: var(--fs-dust); color: var(--dust-3); flex: none; font-variant-numeric: tabular-nums; }
    .row .meta .n { color: var(--ivory); margin-right: 8px; }
    .row .meta .hint { color: var(--amber); font-size: var(--fs-rear); }
    .row .pv { padding-left: calc(1.2ch + 10px); font-size: var(--fs-rear); color: var(--dust-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* the depth queue: size + opacity + blur + offset */
    .row.d0 { font-size: var(--fs-front); color: var(--ivory); min-height: 60px; }
    .row.d1 { font-size: var(--fs-mid); color: var(--ivory); opacity: .95; transform: translateY(1px); }
    .row.d2 { font-size: var(--fs-rear); color: var(--dust-3); opacity: .92; filter: blur(.15px); transform: translateY(2px); }
    .row.d3 { font-size: var(--fs-dust); color: var(--dust-3); opacity: .84; filter: blur(.3px); transform: translateY(3px); }
    .row:hover { background: #101013; }
    .row.selected, .row.selected:hover { background: var(--amber); color: var(--void); opacity: 1; filter: none; transform: none; }
    .row.selected .glyph, .row.selected .meta, .row.selected .meta .n, .row.selected .meta .hint, .row.selected .pv { color: var(--void); }
    .row.selected:focus-visible { outline-color: var(--void); outline-offset: -4px; }
    .row.selected .fill { border-color: rgba(10, 10, 12, .55); }
    .row.alertRow .nm { text-transform: uppercase; letter-spacing: .12em; }
    .none { margin: 8px 12px; color: var(--dust-3); font-size: var(--fs-rear); max-width: 36ch; text-wrap: pretty; }

    /* ---- chat ---- */
    #chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; padding-top: var(--top); }
    .chead { padding: 4px 20px 10px; display: flex; flex-direction: column; gap: 2px; }
    .chead .line1 { display: flex; align-items: center; gap: 4px; min-height: 48px; }
    #back { display: none; width: 48px; height: 48px; margin-left: -14px; font-size: var(--fs-front); color: var(--dust-3); place-items: center; }
    #back:hover { color: var(--ivory); }
    .chead h2 { margin: 0; font-weight: 400; font-size: var(--fs-front); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chead .line2 { display: flex; gap: 10px; align-items: baseline; font-size: var(--fs-rear); color: var(--dust-3); }
    .chead .line2 .ivory { color: var(--ivory); }
    .chead .line2 .warn { color: var(--amber); }
    .chead .line2 > :first-child { flex: none; }
    .chead .line2 > :last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vbtn { margin-left: auto; flex: none; min-height: 44px; padding: 0 4px; font-size: var(--fs-rear); color: var(--dust-3); }
    .vbtn:hover { color: var(--amber); }
    .vbtn.del { margin-left: 8px; min-width: 44px; padding: 0; display: grid; place-items: center; }
    .vbtn.hide + .vbtn.del { margin-left: auto; }
    .vbtn.del:hover, .vbtn.del:focus-visible { color: var(--danger); }
    .verify .vact button.danger { color: var(--danger); }
    .verify .vact button.danger:hover { color: var(--ivory); }
    .verify .vact button.primary { background: var(--ivory); color: var(--void); padding: 0 18px; }
    .verify .vact button.primary:hover { background: var(--amber); color: var(--void); }
    .vbtn.ok { color: var(--ivory); }
    .row .chk { color: var(--ivory); flex: none; }
    .row .warnmark { color: var(--amber); flex: none; }
    .row.selected .chk, .row.selected .warnmark { color: var(--void); }
    .verify .vbody { display: flex; flex-direction: column; align-items: center; gap: 14px; overflow: auto; padding: 8px 0; min-height: 0; }
    .netd .vbody { align-items: stretch; width: min(56ch, 100%); margin: 0 auto; gap: 18px; text-align: left; }
    .netd .vstat { margin: 0; font-size: var(--fs-front); }
    .netd .vstat small { display: block; margin-top: 4px; font-size: var(--fs-rear); color: var(--dust-3); }
    .netd .modes { display: grid; gap: 2px; border: 0; padding: 0; margin: 0; }
    .netd .mode { display: grid; grid-template-columns: 2ch 1fr; column-gap: 8px; min-height: 56px; padding: 8px 10px; color: var(--ivory-2); }
    .netd .mode .car { color: var(--dust-3); }
    .netd .mode small { grid-column: 2; font-size: var(--fs-rear); color: var(--dust-3); text-wrap: pretty; }
    .netd .mode:hover { background: #101013; }
    .netd .mode[aria-checked="true"] { color: var(--ivory); background: var(--void-2); }
    .netd .mode[aria-checked="true"] .car { color: var(--amber); }
    .netd details { border-top: 1px solid var(--dust-1); }
    .netd summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; color: var(--ivory); list-style: none; }
    .netd summary::-webkit-details-marker { display: none; }
    .netd summary::after { content: '+'; margin-left: auto; color: var(--dust-3); }
    .netd details[open] summary::after { content: '\2212'; }
    .netd details > :not(summary) { margin-bottom: 14px; }
    .netd .vintro { max-width: none; text-align: left; }
    .netd .vact { justify-content: flex-start; }
    .verify .vintro { margin: 0; max-width: 46ch; font-size: var(--fs-rear); color: var(--ivory-2); }
    .verify .qr { width: min(60vw, 240px); flex: none; }
    .verify .qr svg { display: block; width: 100%; height: auto; }
    .verify .vfp { font-size: var(--fs-dust); color: var(--dust-3); font-variant-numeric: tabular-nums; text-align: center; word-break: break-all; }
    .verify .vact { display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: center; }
    .verify .vact button, .verify .vpaste button { min-height: 48px; color: var(--ivory); font-size: var(--fs-mid); }
    .verify .vact button:hover, .verify .vpaste button:hover { color: var(--amber); }
    .verify video { width: min(80vw, 280px); background: var(--void-2); }
    .verify .vpaste { display: flex; align-items: center; gap: 10px; width: min(92vw, 420px); border-top: 1px solid var(--dust-1); padding-top: 6px; }
    .verify .vpaste input { flex: 1; min-width: 0; min-height: 48px; font-size: var(--fs-rear); border-bottom: 1px solid var(--dust-2); }
    .verify .vpaste input:focus { border-color: var(--amber); outline: none; }
    .verify .vres { margin: 0; min-height: 1.5em; font-size: var(--fs-rear); color: var(--ivory); text-align: center; max-width: 46ch; }
    .verify .vres.bad { color: var(--amber); }
    #msgs { flex: 1; overflow-y: auto; padding: 8px 20px 12px; display: flex; flex-direction: column; overscroll-behavior: contain; }
    #msgs .log { margin-top: auto; display: flex; flex-direction: column; }
    .day { display: flex; gap: 12px; align-items: center; margin: 18px 0 10px; font-size: var(--fs-dust); color: var(--dust-3); text-transform: uppercase; letter-spacing: .12em; }
    .day::before, .day::after { content: ''; flex: 1; border-top: 1px dotted var(--dust-2); }
    .msg { max-width: min(56ch, 82%); display: flex; flex-direction: column; margin-top: 20px; font-size: var(--fs-mid); overflow-wrap: break-word; }
    .msg.cont { margin-top: 4px; }
    .msg .who { font-size: var(--fs-dust); color: var(--dust-3); margin-bottom: 4px; }
    .msg .txt, .msg .file { padding: 8px 12px; }
    .msg .txt { display: block; white-space: pre-wrap; text-wrap: pretty; line-height: 1.5; }
    .msg.theirs { align-self: flex-start; align-items: flex-start; }
    .msg.theirs .txt, .msg.theirs .file { background: var(--dust-1); color: var(--ivory); }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.mine .txt, .msg.mine .file { background: var(--amber); color: var(--void); }
    .msg.mine .file .act { color: rgba(10, 10, 12, .72); }
    .msg.mine .file:hover .act { color: var(--void); text-decoration: underline; }
    .msg .st { font-size: var(--fs-dust); color: var(--dust-3); margin-top: 2px; display: flex; gap: 8px; }
    .msg .st .g { letter-spacing: -.1em; }
    .msg .st.read, .msg .st.read .g { color: var(--ivory); }
    .msg .st.wait { color: var(--ivory); }
    .msg.t0 { animation: arrive .38s var(--ease) both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } }
    .msg.alert { align-self: stretch; max-width: none; background: var(--ivory); color: var(--void); padding: 10px 14px; margin-top: 20px; width: auto; text-align: left; align-items: stretch; filter: none; opacity: 1; }
    .msg.alert .txt, .msg.alert .file { background: none; color: inherit; padding: 0; }
    .msg.alert .who, .msg.alert .st, .msg.alert .st .g { color: var(--void); }
    .msg.alert .who { text-transform: uppercase; letter-spacing: .12em; }
    .empty { color: var(--dust-3); font-size: var(--fs-rear); display: grid; gap: 4px; max-width: 44ch; margin-bottom: 8px; }
    .empty .t { color: var(--ivory); font-size: var(--fs-front); margin-bottom: 8px; }
    .empty div { text-wrap: pretty; }
    #jump { position: absolute; right: 20px; bottom: 120px; min-height: 48px; padding: 0 8px; font-size: var(--fs-rear); color: var(--ivory); background: var(--void); }
    #notice { margin: 0 20px 6px; padding: 10px 14px; background: var(--ivory); color: var(--void); font-size: var(--fs-rear); display: flex; gap: 12px; align-items: baseline; text-align: left; min-height: 44px; animation: arrive .38s var(--ease) both; }
    #notice span { flex: 1; text-wrap: pretty; }
    #notice button { min-height: 44px; color: var(--void); font-size: var(--fs-rear); white-space: nowrap; margin: -10px -6px -10px 0; padding: 0 6px; }
    .composer { padding: 6px 20px calc(var(--bottom)); }
    .composer .qline { align-items: flex-end; font-size: var(--fs-mid); min-height: 48px; }
    .composer .car { min-height: 48px; display: grid; place-items: center; font-size: var(--fs-front); }
    #text { flex: 1; min-width: 0; resize: none; min-height: 48px; max-height: 144px; font-size: var(--fs-mid); line-height: 1.45; padding: 12px 0; overflow-y: auto; scrollbar-width: none; }
    .sendBtn { min-height: 48px; min-width: 48px; display: grid; place-items: center; padding: 0; color: var(--dust-2); font-size: var(--fs-mid); transition: color .15s; white-space: nowrap; }
    .sendBtn:not(:disabled) { color: var(--amber); }
    .sendBtn:not(:disabled):hover { color: var(--ivory); }
    .sendBtn:disabled { cursor: default; }
    .composer.alert .sendBtn:not(:disabled) { background: var(--ivory); color: var(--void); }
    .attach { min-height: 48px; min-width: 48px; display: grid; place-items: center; padding: 0; margin-right: 2px; color: var(--amber); font-size: var(--fs-mid); text-align: center; transition: color .15s; white-space: nowrap; }
    .attach:hover { color: var(--ivory); }
    .msg .img { display: block; padding: 0; margin-top: 4px; max-width: 100%; }
    .msg .img img { display: block; max-width: 100%; max-height: 300px; min-height: 48px; background: var(--void-2); }
    .msg.t1 .img img { max-height: 190px; }
    .msg.t2 .img img { max-height: 110px; }
    .msg .cap { font-size: var(--fs-dust); color: var(--dust-3); margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg.mine .img { align-self: flex-end; }
    .msg .file { display: flex; gap: 10px; align-items: baseline; width: min(420px, 78vw); min-height: 48px; color: inherit; flex-wrap: wrap; }
    .msg .file .act { margin-left: auto; }
    .msg .file .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
    .msg .file .ttl { display: flex; min-width: 0; max-width: 100%; flex: 0 1 auto; }
    .msg .file .ext { flex: none; }
    .msg .file .act { color: var(--dust-3); font-size: var(--fs-rear); flex: none; }
    .msg .file:hover .act { color: var(--amber); }
    .xfer { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: var(--fs-rear); color: var(--dust-3); margin-top: 10px; max-width: min(420px, 86%); }
    .xfer.stalled { color: var(--ivory); }
    .xfer button { min-height: 44px; color: var(--dust-3); font-size: var(--fs-rear); }
    .xfer button:hover { color: var(--amber); }
    .lightbox { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--void); padding: var(--top) 12px var(--bottom); }
    .lightbox .bar { display: flex; gap: 14px; align-items: baseline; justify-content: space-between; font-size: var(--fs-rear); color: var(--dust-3); }
    .lightbox .bar button { min-height: 48px; min-width: 48px; color: var(--ivory); font-size: var(--fs-mid); }
    .lightbox .bar button:hover { color: var(--amber); }
    .lightbox .bar a { color: var(--ivory); text-decoration: none; min-height: 48px; display: inline-flex; align-items: center; }
    .lightbox .bar a:hover { color: var(--amber); }
    .lightbox .bar > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lightbox .stage { display: grid; place-items: center; min-height: 0; overflow: auto; touch-action: pinch-zoom pan-x pan-y; }
    .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .composer .hint { margin: 0; font-size: var(--fs-dust); color: var(--dust-3); min-height: 18px; }
    @media (hover: none) { .composer .hint .kb { display: none; } }
    @media (max-width: 760px) { .composer .hint { display: none; } .composer.alert .hint { display: block; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* ---- phone: one pane at a time ---- */
    @media (max-width: 760px) {
      #app { grid-template-columns: minmax(0, 1fr); }
      #app[data-view="list"] #chat, #app[data-view="chat"] #side { display: none; }
      #side { border-right: 0; }
      #back { display: grid; }
      .msg { max-width: 92%; }
      #jump { bottom: 128px; }
    }
  </style>
</head>
<body>
  <div id="welcome" class="hide">
    <form id="welcomeForm" autocomplete="off">
      <div>
        <h1><span class="car">›</span> ChaX</h1>
        <p>Messagerie en réseau maillé. Chaque téléphone relaie les autres : pas de compte, pas de serveur.</p>
      </div>
      <label class="qline"><span class="car" aria-hidden="true">›</span><span class="sr">Votre pseudo</span><input id="nick" maxlength="24" placeholder="pseudo" autocapitalize="words" spellcheck="false" /></label>
      <div class="facts">
        <div><span>chiffré</span><span class="fill"></span><span>de bout en bout</span></div>
        <div><span>relais</span><span class="fill"></span><span>d’appareil en appareil</span></div>
        <div><span>absent</span><span class="fill"></span><span>livré plus tard</span></div>
      </div>
      <button class="go" type="submit">entrer dans le mesh ›</button>
    </form>
  </div>

  <div id="app" class="hide" data-view="list">
    <aside id="side" aria-label="Conversations">
      <div class="top">
        <div class="id">
          <svg class="cat" viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 1.5 6 5h4l4-3.5V9c0 3.5-2.7 5.5-6 5.5S2 12.5 2 9z"/><path fill="#0a0a0c" d="M5 8h2v2H5zM9 8h2v2H9z"/></svg>
          <span class="wm" id="meName"></span>
          <span id="flash" role="status" aria-live="polite"></span>
          <span id="netBtn" class="links hide" role="img" aria-label="Liaisons"><svg class="bt" data-s="off" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/><path class="x" d="M3.5 20.5 20.5 3.5"/></svg><svg class="gl" data-s="off" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3 3.2 15 0 18M12 3c-3.2 3-3.2 15 0 18"/><path class="x" d="M3.5 20.5 20.5 3.5"/></svg></span>
          <button id="netLink" class="gear hide" type="button" aria-label="Paramètres" title="Paramètres"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
        </div>
        <button class="fp" id="fp" type="button" aria-label="Ouvrir mon code pour me faire vérifier en personne"><span id="meFp"></span><span class="act" aria-hidden="true">mon code ›</span></button>
        <div class="sondeLine"><span class="sonde" id="sonde" aria-hidden="true"></span><span id="meshTxt"></span></div>
        <button id="upd" class="upd hide" type="button"></button>
      </div>
      <div class="groupbar"><span>conversations</span><span id="count" class="tnum"></span></div>
      <nav id="convs" aria-label="Liste des conversations"></nav>
    </aside>

    <main id="chat" aria-label="Conversation">
      <header class="chead">
        <div class="line1">
          <button id="back" type="button" aria-label="Retour aux conversations">‹</button>
          <h2 id="title"></h2>
          <button id="vbtn" class="vbtn hide" type="button"></button>
          <button id="delBtn" class="vbtn del hide" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><path d="M4 7h16M9.5 7V4h5v3M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg></button>
        </div>
        <div class="line2" id="sub"></div>
      </header>
      <div id="msgs" role="log" aria-live="polite" aria-label="Messages" tabindex="0"><div class="log" id="log"></div></div>
      <button id="jump" class="hide" type="button">nouveaux messages ↓</button>
      <div id="notice" class="hide" role="alert"><span id="noticeTxt"></span><button id="noticeX" type="button">compris ›</button></div>
      <form class="composer" id="composer">
        <div class="qline">
          <span class="car" aria-hidden="true">›</span>
          <label for="text" class="sr">Votre message</label>
          <textarea id="text" rows="1" enterkeyhint="send"></textarea>
          <button class="attach" id="attach" type="button" aria-label="Joindre une photo ou un fichier" title="Joindre une photo ou un fichier"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><path d="M20 11.5 12 19.5a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.8 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7.2"/></svg></button>
          <input id="pick" class="hide" type="file" multiple tabindex="-1" aria-hidden="true" />
          <button class="sendBtn" id="sendBtn" type="submit" aria-label="Envoyer" title="Envoyer" disabled><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><path d="M4 12h15M13 5.5l6.5 6.5-6.5 6.5"/></svg></button>
        </div>
        <p class="hint" id="hint"></p>
      </form>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
